name: Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t job_ai_assistant:ci .

      - name: Ruff Check
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            job_ai_assistant:ci \
            ruff check .

      - name: Ruff Format
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            job_ai_assistant:ci \
            ruff format --check .

      - name: Run Pytest
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: job-ai-assistant-ci
        run: |
          docker run --rm \
            -e LANGSMITH_API_KEY \
            -e LANGSMITH_TRACING \
            -e LANGSMITH_PROJECT \
            -v "$PWD:/app" \
            -w /app \
            job_ai_assistant:ci \
            python -m pytest