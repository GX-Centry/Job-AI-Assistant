name: Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t job_ai_assistant:ci .

      - name: Run Pytest
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            job_ai_assistant:ci \
            python -m pytest